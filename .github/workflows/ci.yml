name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: "Also run the paid LLM benchmark eval"
        type: boolean
        default: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # A real Postgres, not sqlite-in-memory: this project relies on Postgres
    # role-based grants for the read-only execution path, which sqlite has
    # no equivalent of. A service container gives CI the same engine as prod.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
          POSTGRES_DB: wms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql+psycopg2://wms:wms@localhost:5432/wms_test
      DATABASE_URL: postgresql+psycopg2://wms:wms@localhost:5432/wms_test
      DATABASE_URL_READONLY: postgresql+psycopg2://wms_readonly:wms_readonly@localhost:5432/wms_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Verify Alembic migrations apply cleanly
        run: alembic upgrade head

      - name: Run tests with coverage (excludes paid benchmark eval)
        run: pytest -m "not benchmark" --cov=app --cov-report=term-missing --cov-fail-under=75

      # The benchmark needs real seeded data to score against — CI only has
      # the one Postgres service container, so seed wms_test itself here
      # rather than standing up a second database just for this job.
      - name: Seed synthetic data (benchmark only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_benchmark
        run: python -m scripts.generate_synthetic_data

      - name: Run benchmark eval (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest -m benchmark

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t wms-nl-query:ci .
