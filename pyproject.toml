[tool.ruff]
line-length = 100
# py310, not py311: this is the minimum supported interpreter (local dev
# venvs may run 3.10 even though Docker/CI use 3.11) — matters concretely
# because UP017 would otherwise suggest datetime.UTC, which doesn't exist
# before 3.11.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length, not worth the churn. B008: FastAPI's Depends()-in-
# argument-defaults is the framework's required idiom, not a bug.
ignore = ["E501", "B008"]
